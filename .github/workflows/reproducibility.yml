name: Reproducibility smoke checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fresh-solver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install numerical dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify supplied scientific files and authentic fixture
        run: python scripts/public_reproduce.py --check-only
      - name: Fresh 128-origin NSW replay
        run: python scripts/public_reproduce.py --smoke --output-root "$RUNNER_TEMP/rdia-smoke"
      - name: Thirty SPO+ oracle checks
        run: python scripts/public_reproduce.py --oracle-only --output-root "$RUNNER_TEMP/rdia-oracle"
