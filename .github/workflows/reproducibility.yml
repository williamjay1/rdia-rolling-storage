name: Reproducibility smoke checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fresh-solver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install numerical dependencies
        run: python -m pip install -r requirements.txt
      - name: Exercise downloader through a local HTTP server and reject invalid archives
        run: python -B tests/test_download_release.py --output-root "$RUNNER_TEMP/rdia-download-tests"
      - name: Verify supplied scientific files and authentic fixture
        run: python scripts/public_reproduce.py --check-only
      - name: Verify declared checkout files without claiming complete attached data
        run: |
          python - <<'PY'
          import subprocess, sys
          result = subprocess.run([sys.executable, '-B', 'scripts/verify_release_bundle.py', '--check-only', '--checkout'])
          assert result.returncode == 3, 'A source checkout must be explicitly incomplete, with no undeclared omission or hash failure'
          PY
      - name: Verify separately manifested v14 scientific files
        run: python -B addenda/v14/computational/scripts/verify_manifest.py addenda/v14/computational
      - name: Verify separately manifested v15 code and every supplied input
        run: python -B addenda/v15/reproduce_v15.py --check-only
      - name: Verify portable v16 figure file integrity without redrawing
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          root = Path("addenda/v16_figures")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert manifest["file_count"] == len(manifest["files"])
          expected = {record["path"] for record in manifest["files"]} | {"manifest.json"}
          actual = {path.relative_to(root).as_posix() for path in root.rglob("*") if path.is_file()}
          assert actual == expected, ("Unexpected or missing figure files", actual ^ expected)
          for record in manifest["files"]:
              relative = Path(record["path"])
              assert not relative.is_absolute() and ".." not in relative.parts
              path = root / relative
              assert path.stat().st_size == record["bytes"], record["path"]
              assert hashlib.sha256(path.read_bytes()).hexdigest() == record["sha256"], record["path"]
          print(f"PASS: {len(expected)} v16 plotting files; all manifest hashes match; no redraw requested")
          PY
      - name: Fresh 128-origin NSW replay
        run: python scripts/public_reproduce.py --smoke --output-root "$RUNNER_TEMP/rdia-smoke"
      - name: Thirty SPO+ oracle checks
        run: python scripts/public_reproduce.py --oracle-only --output-root "$RUNNER_TEMP/rdia-oracle"
